<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open course map" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#home" aria-label="VCE 3/4 Field Guide home">

      <path d="M6 24 C 10 8, 22 8, 26 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2.5 3.2"/>
      <circle cx="16" cy="12" r="3.2" fill="#fff"/>
      <path d="M16 15.5 v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M13.8 19.6 L16 22 L18.2 19.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-name">VCE 3/4<br><em>Field Guide</em></span>
  </a>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search all subjects: topics, formulas, terms…" autocomplete="off" spellcheck="false" aria-label="Search the guide" aria-controls="results" aria-autocomplete="list">
    <kbd>/</kbd>
    <div class="results" id="results" role="listbox" hidden></div>
  </div>
  <nav class="top-actions" aria-label="Quick links">
    <a class="tbtn" href="#gauntlet" title="Trick question gauntlet and quiz mode">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
      <span class="lbl">Quiz</span>
    </a>
    <a class="tbtn" href="#review" title="Questions you flagged for review">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span class="lbl">Review</span><span class="count" id="reviewCount"></span>

      <span class="lbl">CAS</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Switch colour theme" title="Switch light / dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>
<div class="layout">
